<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Ismael Bovingdon Castillejo — Junior Data Engineer</title>
  <desc>Banner header with dark navy to orange gradient</desc>

  <defs>
