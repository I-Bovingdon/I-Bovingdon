      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="60%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#7A3200"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#8B3A00"/>
    </linearGradient>
    <clipPath id="clip">
