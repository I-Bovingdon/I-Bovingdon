  <circle cx="820" cy="30" r="45" fill="#FF8C42" opacity="0.08"/>
  <circle cx="140" cy="160" r="60" fill="#1A3A5C" opacity="0.25"/>

  <text x="60" y="72"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="600"
