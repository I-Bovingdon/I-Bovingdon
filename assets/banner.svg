  </defs>

  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <path d="M0 155 C150 130, 300 170, 450 148 C600 126, 750 160, 900 140 L900 200 L0 200 Z" fill="#0A1628" opacity="0.5"/>
  <path d="M0 165 C180 145, 350 178, 500 158 C650 138, 780 168, 900 152 L900 200 L0 200 Z" fill="#061020" opacity="0.7"/>

